[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "helia-testing"
version = "0.1.0"
description = "Reproducible, failure-guided testing of Python repositories"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "coverage>=7.6,<8", "pytest>=8,<9", "cosmic-ray>=8.4,<9", "anthropic>=0.40,<1"]

[project.optional-dependencies]
dev = ["ruff>=0.9", "mypy>=1.14", "types-PyYAML", "pytest-cov>=6"]
coverup = ["coverup>=0.5"]
plots = ["matplotlib>=3.9"]

[project.scripts]
helia = "helia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/helia", "contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["targets/checkouts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

