name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.13'
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check .
      - run: uv run mypy src contracts
      - run: uv run pytest -q
      - run: uv run helia run configs/demo.yaml
      - run: docker build -f docker/Dockerfile -t helia-runner:ci .
      - run: uv run pytest -q tests/test_docker_integration.py
        env:
          HELIA_DOCKER_IMAGE: helia-runner:ci
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

